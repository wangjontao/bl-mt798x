name: CMCC A10 stock non-NMBM DHCPD U-Boot

on:
  workflow_dispatch:
  push:
    branches:
      - codex/cmcc-a10-dhcpd

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu build-essential flex bison libssl-dev \
            device-tree-compiler qemu-user-static nodejs npm python3

      - name: Fetch DHCPD U-Boot source
        run: |
          git init source
          git -C source remote add origin https://github.com/Yuzhii0718/bl-mt798x-dhcpd.git
          git -C source fetch --depth=1 origin 0f584098854f2956d5d36f3fbe6b786fafeb7e74
          git -C source checkout --detach FETCH_HEAD

      - name: Patch A10 memory and UBI writes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path("source/uboot-mtk-20250711/board/mediatek/common/mtd_helper.c")
          text = helper.read_text()

          old_write = (
              "\t\t\tif (!ret && ii.type == IMAGE_UBI2 &&\n"
              "\t\t\t    !IS_ENABLED(CONFIG_MTK_DUAL_BOOT))\n"
              "\t\t\t\treturn mtd_update_generic(mtd, data, size, true);\n"
          )
          new_write = (
              "\t\t\tif (!ret && ii.type == IMAGE_UBI2 &&\n"
              "\t\t\t    !IS_ENABLED(CONFIG_MTK_DUAL_BOOT)) {\n"
              "\t\t\t\t/* Erase the full UBI partition before writing. */\n"
              "\t\t\t\tubi_detach();\n"
              "\t\t\t\tret = mtd_erase_skip_bad(mtd, 0, mtd->size, mtd->size,\n"
              "\t\t\t\t\t\t\t NULL, NULL, NULL, false);\n"
              "\t\t\t\tif (ret)\n"
              "\t\t\t\t\treturn ret;\n"
              "\n"
              "\t\t\t\treturn mtd_write_skip_bad(mtd, 0, size, mtd->size,\n"
              "\t\t\t\t\t\t\t  NULL, data, true);\n"
              "\t\t\t}\n"
          )
          if old_write not in text:
              raise SystemExit("ERROR: expected IMAGE_UBI2 write path not found")
          helper.write_text(text.replace(old_write, new_write, 1))

          dts = Path("source/uboot-mtk-20250711/arch/arm/dts/mt7981-cmcc_a10.dts")
          dts_text = dts.read_text()
          old_mem = "reg = <0x40000000 0x10000000>;"
          new_mem = "reg = <0x40000000 0x20000000>;"
          if old_mem not in dts_text:
              raise SystemExit("ERROR: expected A10 memory node not found")
          dts.write_text(dts_text.replace(old_mem, new_mem, 1))
          PY

          grep -A17 'ii.type == IMAGE_UBI2' source/uboot-mtk-20250711/board/mediatek/common/mtd_helper.c | grep -q 'mtd_erase_skip_bad'
          grep -A17 'ii.type == IMAGE_UBI2' source/uboot-mtk-20250711/board/mediatek/common/mtd_helper.c | grep -q 'mtd_write_skip_bad'
          grep -q 'reg = <0x40000000 0x20000000>;' source/uboot-mtk-20250711/arch/arm/dts/mt7981-cmcc_a10.dts

      - name: Build A10 fixed 64 MiB stock BL2 and FIP
        working-directory: source
        run: |
          chmod +x build.sh

          cp uboot-mtk-20250711/configs-nonmbm/mt7981_cmcc_a10_defconfig \
            uboot-mtk-20250711/configs-nonmbm/mt7981_cmcc_a10_stock_defconfig
          sed -i \
            's#CONFIG_MTDPARTS_DEFAULT=.*#CONFIG_MTDPARTS_DEFAULT="spi-nand0:1024k(BL2),512k(u-boot-env),2048k(Factory),2048k(FIP),65536k(ubi)"#' \
            uboot-mtk-20250711/configs-nonmbm/mt7981_cmcc_a10_stock_defconfig
          grep -q '65536k(ubi)' \
            uboot-mtk-20250711/configs-nonmbm/mt7981_cmcc_a10_stock_defconfig

          SOC=mt7981 \
          BOARD=cmcc_a10 \
          VERSION=2025 \
          VARIANT=nonmbm \
          UBOOT_CFG=mt7981_cmcc_a10_stock_defconfig \
          FIXED_MTDPARTS=1 \
          MULTI_LAYOUT=0 \
          FSTHEME=bootstrap \
          UBIMNG=1 \
          COPY_BL2=1 \
          ./build.sh 2>&1 | tee ../build-a10.log

      - name: Validate and collect
        run: |
          set -eu
          mkdir -p release
          find source/output -maxdepth 1 -type f -name '*cmcc_a10*' -exec cp -v {} release/ \;
          test "$(find release -type f -name 'bl2-*' | wc -l)" -ge 1
          test "$(find release -type f -name 'fip-*' | wc -l)" -ge 1
          (cd release && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: CMCC-A10-STOCK-NONMBM-DHCPD-UBOOT-${{ github.run_number }}
          path: |
            release/
            build-a10.log
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "cmcc-a10-stock-nonmbm-dhcpd-${GITHUB_RUN_NUMBER}" release/* \
            --target "$GITHUB_SHA" \
            --title "CMCC A10 stock non-NMBM DHCPD U-Boot ${GITHUB_RUN_NUMBER}" \
            --notes 'CMCC A10 MT7981: fixed stock 64 MiB UBI layout, standard non-NMBM spi-nand0, 512 MB RAM, DHCP failsafe WebUI, and full UBI partition erase before firmware writes. Flash the generated BL2 and FIP as a matched pair.'
